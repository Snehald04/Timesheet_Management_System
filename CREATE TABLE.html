<html>
<head>
    <script type="text/javascript" src="create_table.js"></script>
    <meta date="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>

</head>
<body>
    <div class="container">
        <!-- Button to Open the Modal -->
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">Create Timesheet</button>
        
        <!-- The Modal -->
        <div class="modal fade" id="myModal">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    
                    <!-- Modal Header -->
                    <div class="modal-header">
                        <h4 class="modal-title">Create Timesheet</h4>
                    </div>
    
                    <!-- Modal body -->
                    <div class="modal-body">
                        <table class="table table-bordered" id="data_table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Task</th>
                                    <th>Description</th>
                                    <th>Efforts(No. hrs)</th>
                                    <th>Call No</th>
                                    <th>Actions</th>
                                 </tr>
                            </thead>
                            <tbody>
                                <tr id="row1">
                                    <td><input type="date" class="form-control" id="new_date" required></td>
                                    <td><input type="text" class="form-control" id="new_task" required></td>
                                    <td><input type="text" class="form-control" id="new_description" required></td>
                                    <td><input type="text" class="form-control" id="new_efforts" maxlength="1" required></td>
                                    <td><input type="text" class="form-control" id="new_call" required></td>
                                    <td>
                                        <button class="btn edit" id="edit_button1" value="Edit" onclick="edit_row('1')" title="Edit"><i class="fa fa-edit"></i></button>
                                        <button class="btn save" id="save_button1" value="Save" onclick="save_row('1')" title="Save"><i class="fa fa-folder"></i></button>
                                        <button class="btn delete" id="delete_button1" value="Delete" onclick="delete_row('1')" title="Delete"><i class="fa fa-trash"></i></button>
                                        <button class="btn add" id="add button1" value="Add" onclick="add_row(1)" title="Add"><i class="fa fa-plus"></i></button>
                                        <!--<input type="button" id="save_button1" value="Save" class="save" onclick="save_row('1')">
                                        <input type="button" value="Delete" class="delete" onclick="delete_row('1')">-->
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>  
    </div>          
</body>
</html>
